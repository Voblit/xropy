<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet</title>
</head>

<body>

    <input id="url" placeholder="https://example.com">
    <button id="go">Go</button>

    <iframe
        id="frame"
        style="width:100%; height:90vh; border:0;">
    </iframe>

    <script type="module">

        import {
            Controller
        } from "https://esm.run/@petezah-games/scramjet-controller";


        const registration =
            await navigator.serviceWorker.register(
                "./sw.js",
                {
                    type: "module",
                    scope: "./"
                }
            );


        await navigator.serviceWorker.ready;


        console.log(
            "Scramjet service worker ready:",
            registration.scope
        );


        const controller =
            new Controller();


        await controller.wait();


        const frame =
            controller.createFrame(
                document.querySelector("#frame")
            );


        document
            .querySelector("#go")
            .addEventListener("click", () => {

                let url =
                    document
                        .querySelector("#url")
                        .value
                        .trim();


                if (!/^https?:\/\//i.test(url)) {
                    url = "https://" + url;
                }


                frame.go(url);

            });

    </script>

</body>
</html>
