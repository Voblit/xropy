

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scramjet Module Setup</title>
</head>
<body>


  <script type="module">
  if ('serviceWorker' in navigator) {
    try {
      const registration = await navigator.serviceWorker.register('./sw.js', {
        type: 'module',
        scope: '/'
      });
      console.log('Scramjet Service Worker active at scope:', registration.scope);
    } catch (err) {
      console.error('Service Worker registration failed:', err);
    }
  }
</script>

</body>
</html>
