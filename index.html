

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scramjet Module Setup</title>
</head>
<body>

<script type="module">
  import { ScramjetClient, defaultConfig } from 'https://cdn.jsdelivr.net/npm/@petezah-games/scramjet@2.0.3-petezah-alpha/+esm';

  // Instantiate the client using default settings
  const client = new ScramjetClient(defaultConfig);

  // Encode a URL for proxying
  const proxiedUrl = client.rewriteUrl('https://example.com');
  console.log('Encoded target URL:', proxiedUrl);
</script>
  <script type="module">
  if ('serviceWorker' in navigator) {
    try {
      const registration = await navigator.serviceWorker.register('./sw.js', {
        type: 'module',
        scope: '/'
      });
      console.log('Scramjet Service Worker active at scope:', registration.scope);
    } catch (err) {
      console.error('Service Worker registration failed:', err);
    }
  }
</script>

</body>
</html>
